{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My To-Do List{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'tasks/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a class="brand" href="{% url 'task_list' %}">My To-Do List</a>
            <a class="button button-primary" href="{% url 'add_task' %}">Add Task</a>
        </div>
    </header>
    <main class="page-content">
        {% if messages %}
            {% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
